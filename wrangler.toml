# Agent Site Checker — check.muretai.com
#
# A SUBDOMAIN, NOT A PATH ON THE APEX, and both halves of that are deliberate. muretai.com's
# route table has taken production down twice by claiming a prefix the relay also owned, and
# `muretai.com/` is itself an A2A door — the MCP spec's rule is that a door and an MCP endpoint
# never share a path. A hostname keeps them apart in a way nobody has to remember.
#
# Deploy — THE ACCOUNT MATTERS. Deploying to the wrong Cloudflare account does not error in
# an obvious way, it succeeds somewhere plausible; that has cost this project whole sessions.
#
#   wrangler deploy              # with the account that owns the zone activated
#
# BEFORE THE FIRST DEPLOY: `check.muretai.com` needs a proxied DNS record on the zone (an
# AAAA to 100:: is the conventional placeholder) or the route below matches nothing and the
# hostname does not resolve — the Worker deploys clean and the service is simply unreachable.
#
# AND CHECK THE ZONE TOGGLE: Browser Integrity Check must stay OFF. An MCP client is not a
# browser and BIC 403s exactly this traffic — muretai's own Agent Entry door was dark for
# three days for that reason, and no test can see it.
name = "agent-site-checker"
main = "src/worker.mjs"
# THE ACCOUNT IS NOT IN THIS FILE, BY OWNER DIRECTIVE. Set CLOUDFLARE_ACCOUNT_ID in the
# environment before deploying (the account switcher this project uses exports it from the
# token). If it is missing, wrangler resolves the zone against whichever account it happens to
# be authenticated as and fails with "Could not find zone for muretai.com" — an error that
# names neither the cause nor the cure, so check that variable first.
#
# The failure that taught this: a deploy run as `source switcher | head -3 && wrangler deploy`
# lost the exports to the pipe's subshell and went out under the wrong identity. Source the
# switcher WITHOUT a pipe.
compatibility_date = "2026-07-01"
# nodejs_compat: the verification code is src/seam.mjs (the seam of Agent Entry — its wire
# layer, vendored from agent-seam), which uses node:crypto and Buffer for Ed25519.
#
# global_fetch_strictly_public IS LOAD-BEARING AND MUST NEVER BE REMOVED. Without it, a
# Worker's subrequest to a hostname on its OWN zone is routed straight to the zone's origin
# server — "ignoring any Workers mapped to the URL and also bypassing Cloudflare security
# settings" (Cloudflare's own words). Measured on the first live deploy, 2026-08-23: this
# service, hosted on the muretai.com zone, fetched https://muretai.com/ and reached the Fly
# relay behind it instead of the public site. The relay serves a minimal landing at / and 404s
# the rest, so the checker reported OUR OWN flagship site as having no agent card, no llms.txt,
# no robots.txt and no door — while every external site it checked was fine.
#
# That is this product'"'"'s own thesis turned on itself: the thing that answered was not the thing
# a visitor would have asked. A checker MUST reach its target the way the public reaches it, and
# on Cloudflare that takes this flag.
compatibility_flags = ["nodejs_compat", "global_fetch_strictly_public"]

routes = [
  { pattern = "check.muretai.com/*", zone_name = "muretai.com" },
]

# THE ONLY VOLUME CONTROL THIS SERVICE HAS. rateLimited() in worker.mjs fails OPEN when the
# binding is missing — which is right for availability and meant that, while this stayed
# commented out, the "cost control" the whole design leaned on did not exist in production.
# An audit found it. Keep it bound.
[[unsafe.bindings]]
name = "RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 60, period = 60 }
